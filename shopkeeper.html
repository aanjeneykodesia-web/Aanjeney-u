 <!DOCTYPE html><html>
<head>
<title>Shopkeeper Dashboard</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
<script type="module" src="../js/login.js"></script>
<script type="module" src="../js/orders.js"></script>
</head>
<body><h2>PRICE List</h2>
<a href="price.pdf" download>
  <button>Download Price List</button>
</a><h3>Add Products</h3>
<input type="text" id="productName" placeholder="Product Name">
<input type="number" id="productQty" placeholder="Quantity">
<button onclick="addToCart()">Add To Cart</button><h3>Cart Items</h3>
<ul id="cartList"></ul><button onclick="openPaymentPopup()" class="green-btn">Pay</button>

<h3>Total Price: <span id="totalPrice">₹0</span></h3><h2>Scan to Pay</h2>
<img src="upi-qr.png" width="250">
<p>Scan this QR to pay via UPI</p><h2>📦 My Live Orders</h2>
<div id="ordersBox"></div><!-- PAYMENT POPUP --><div id="orderPopup" class="popup">
  <div class="popup-box">
    <h2>💰 Payment Confirmation</h2>
    <p>Total Price: ₹<span id="popupTotalPrice"></span></p><h3>Upload Payment Screenshot</h3>
<input type="file" id="paymentProof" accept="image/*"><br><br>
<img id="proofPreview" width="200"><br><br>

<button onclick="sendConfirmedOrder()">Send Order</button>
<button onclick="closePopup()">Close</button>

  </div>
</div><script type="module" src="shopOrders.js"></script><script src="dataManager.js"></script><style>
.popup {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.7);
  z-index: 9999;
}

.popup-box {
  background: #111827;
  color: white;
  width: 90%;
  max-width: 350px;
  padding: 20px;
  border-radius: 12px;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  box-shadow: 0 0 20px #16a34a;
}

.popup-box button {
  background: #16a34a;
  color: white;
  border: none;
  padding: 10px 15px;
  margin: 5px;
  border-radius: 6px;
  font-size: 16px;
}
</style><script>
import { db } from "../js/firebase.js";
import { collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

async function sendConfirmedOrder() {
  const total = document.getElementById("totalPrice").innerText;

  await addDoc(collection(db, "orders"), {
    products: cartItems,   // your cart array
    totalPrice: total,
    status: "pending",
    time: new Date()
  });

  alert("✅ Order Sent to Firebase!");
  closePopup();
}
</script></body>
 </html>
